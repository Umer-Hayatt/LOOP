services:
  - type: web
    name: looponics-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: HOST_EMAIL
        sync: false
      - key: HOST_CALENDAR_ID
        value: primary
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://looponics.tech,http://localhost:5500,https://loop-btqc.onrender.com
      - key: TIMEZONE
        value: Asia/Karachi
      - key: MEETING_MINUTES
        value: 30

